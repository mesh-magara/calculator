<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="main-container">
      <div class="result-box">
        <div id="output"></div>
        <div class="result"></div>
      </div>

      <div class="buttons">
        <button class="number ops">0</button>
        <button class="number ops">1</button>
        <button class="number ops">2</button>
        <button class="operator">+</button>
        <button class="number ops">3</button>
        <button class="number ops">4</button>
        <button class="number ops">5</button>
        <button class="operator">*</button>
        <button class="number ops">6</button>
        <button class="number ops">7</button>
        <button class="number ops">8</button>
        <button class="number ops">9</button>
        <button class="clear">C</button>
        <button class="operator">-</button>
        <button class="operator">/</button>
        <button class="output">=</button>
      </div>
    </div>
  </body>
</html>
